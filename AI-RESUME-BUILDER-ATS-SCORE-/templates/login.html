<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/main.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/login.css') }}"
    >
</head>

<body class="site-bg">

    <!-- Navigation -->
    <header class="nav">

        <a
            class="logo"
            href="{{ url_for('home') }}"
        >
            AI Resume Builder
        </a>

        <nav class="nav-links">

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </nav>

    </header>

    <!-- Main Content -->
    <main class="container">

        <div class="auth-wrap">

            <div class="glass card auth-card">

                <div class="eyebrow">

                </div>

                <h1>
                    Login
                </h1>

                <p class="muted">
                    Access your resume builder dashboard.
                </p>

                <!-- Login Form -->
                <form method="POST">

                    <div class="form-group">

                        <label
                            class="label"
                            for="email"
                        >
                            Email
                        </label>

                        <input
                            class="input"
                            type="email"
                            id="email"
                            name="email"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label
                            class="label"
                            for="password"
                        >
                            Password
                        </label>

                        <input
                            class="input"
                            type="password"
                            id="password"
                            name="password"
                            required
                        >

                    </div>

                    <button

                        type="submit"
                    >
                        Login
                    </button>

                </form>

                <p class="small">

                    </a>
                </p>

            </div>

        </div>

    </main>
