{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap"><form class="form-panel auth-panel" method="post"><p class="eyebrow">WELCOME BACK</p><h1>Log in</h1><p class="muted">Access your saved analysis history.</p><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn btn-primary full-button" type="submit">Login</button><p class="center">New here? <a href="{{ url_for('register') }}">Create an account</a></p></form></div>
{% endblock %}
